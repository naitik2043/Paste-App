name: Refresh npm lockfile

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: npm
      - name: Verify Node.js runtime
        run: node -e "if (process.versions.node.split('.')[0] !== '26') process.exit(1); console.log(process.version)"
      - name: Resolve and reconcile dependencies
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean installation
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Run quality checks
        run: npm run check
      - name: Push a verified lockfile maintenance branch
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "The npm lockfile is already synchronized."
            exit 0
          fi

          branch="chore/lockfile-refresh-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): refresh npm lockfile"
          git push origin "$branch"
          echo "Verified branch pushed: https://github.com/${GITHUB_REPOSITORY}/tree/$branch"
          echo "Open a pull request from that branch after reviewing the generated lockfile."
