name: Refresh npm lockfile

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/lockfile-refresh.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[lock-sync]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Resolve and reconcile dependencies
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean installation
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Run quality checks
        run: npm run check
      - name: Open a lockfile maintenance pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "The npm lockfile is already synchronized."
            exit 0
          fi

          branch="chore/lockfile-refresh-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): refresh npm lockfile"
          git push origin "$branch"

          gh pr create \
            --base master \
            --head "$branch" \
            --title "chore(deps): refresh npm lockfile" \
            --body "## Summary\nSynchronizes package-lock.json with package.json using Node.js 26 and npm.\n\n## Verification\n- npm ci\n- npm audit --omit=dev --audit-level=high\n- npm run check"
