name: Paste Vault quality

on:
  push:
    branches: [master, main, "feat/**"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: paste-vault-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate (Node.js 26)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: npm
      - name: Verify Node.js runtime
        run: node -e "if (process.versions.node.split('.')[0] !== '26') process.exit(1); console.log(process.version)"
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify production dependency security
        run: npm audit --omit=dev --audit-level=high
      - name: Lint, test and build
        run: npm run check
